# Temporary — providers will be moved out-of-tree.
# Remove this workflow once KubeRay provider has its own repository and CI.
name: Release KubeRay Provider

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'providers/kuberay/**'
      - 'providers/pkg/shim/**'
      - 'controller/**'
      - 'versions.env'
      - '.github/workflows/release-kuberay-provider.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push KubeRay Provider Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard fork publication context
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: python3 .github/rehearsal/guard.py context workflow_dispatch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set image version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$DISPATCH_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid version: use only letters, numbers, dots, underscores, and hyphens." >&2
              exit 1
            fi
            image_version="$DISPATCH_VERSION"
          else
            image_version="main-${GITHUB_SHA::12}"
          fi
          printf 'IMAGE_VERSION=%s\n' "$image_version" >> "$GITHUB_ENV"
          if [[ "${image_version,,}" =~ -(alpha|beta|rc|dev) ]]; then
            printf 'PUBLISH_LATEST=false\n' >> "$GITHUB_ENV"
          else
            printf 'PUBLISH_LATEST=true\n' >> "$GITHUB_ENV"
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate fork image destinations
        id: fork_guard
        env:
          REHEARSAL_IMAGE_FAMILY: kuberay-provider
          REHEARSAL_VERSION: ${{ inputs.version }}
          REHEARSAL_TAGS: |
            ghcr.io/robert-cronin/airunway-rehearsal-v080-20260910/kuberay-provider:${{ env.IMAGE_VERSION }}
            ${{ env.PUBLISH_LATEST == 'true' && 'ghcr.io/robert-cronin/airunway-rehearsal-v080-20260910/kuberay-provider:latest' || '' }}
        run: python3 .github/rehearsal/guard.py tags workflow_dispatch

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: providers/kuberay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.fork_guard.outputs.tags }}
          build-args: |
            SHIM_VERSION=${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
